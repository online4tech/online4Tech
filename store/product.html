const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function meta(name,content){let el=document.querySelector('meta[name="'+name+'"]');if(!el){el=document.createElement('meta');el.name=name;document.head.append(el)}el.content=String(content??'')}function og(property,content){let el=document.querySelector('meta[property="'+property+'"]');if(!el){el=document.createElement('meta');el.setAttribute('property',property);document.head.append(el)}el.content=String(content??'')}const normalizeProductImageName=value=>String(value||'').normalize('NFKD').toLowerCase().replace(/vu\s*\+/g,'vuplus').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
function productImageCandidates(p){
 const special={'dreambox-one-uhd-used':'dreambox-one.png','vu-zero-4k-pvr-kit':'vu-zero-pvrkit.png'};
 const isFutureProduct=String(p.createdAt||'')>'2026-10-29';
 const useLibrary=p.brand==='Dreambox'||p.category==='PVR Kit'||p.imageFile||p.imageKey||isFutureProduct;
 if(!useLibrary)return [];
 const names=[p.imageFile,p.imageKey,special[p.id],p.slug,p.id,p.name].filter(Boolean);
 const files=[...new Set(names.map(name=>{let file=String(name).includes('/')?String(name).split('/').pop():String(name);if(!/\.(png|webp|jpe?g|avif|svg)$/i.test(file))file=normalizeProductImageName(file)+'.png';return file;}))];
 return files.map(file=>'../assets/images/products/'+file);
}
function productImage(p){return productGallery(p)[0]||productImageCandidates(p)[0]||(p.images||[])[0]||'';}

function fallbackProductImage(img){
 const candidates=(img.dataset.candidates||'').split('|').filter(Boolean);
 const next=Number(img.dataset.candidateIndex||0)+1;
 if(next<candidates.length){img.dataset.candidateIndex=String(next);img.src=candidates[next];return;}

 if(fallback&&img.dataset.fallbackUsed!=='1'){img.dataset.fallbackUsed='1';img.onerror=null;img.src=fallback;}else{img.onerror=null;}
}function values(v){return Array.isArray(v)?v.filter(x=>x!==null&&x!==undefined&&String(typeof x==='object'?(x.name||x.title||x.label||x.url||x.href||''):x).trim()!==''):[]}function sectionItems(title,items,type){

  return '<section class="panel smart-section sales-plugins"><div class="sales-hero"><div class="sales-icon">🧩</div><div><h2>🧩 البلجنات المتوافقة</h2><p class="sales-lead">جهازك مش مجرد رسيفر؛ ده نظام <strong>Enigma2</strong> قابل للتطوير والتخصيص، مع آلاف البلجنات الأصلية والمطورة بواسطة المجتمع العالمي.</p></div></div><div class="sales-badges"><span class="sales-badge">🌍 مجتمع عالمي</span><span class="sales-badge">⚙️ تخصيص متقدم</span><span class="sales-badge">🔄 أدوات تتطور باستمرار</span><span class="sales-badge">📺 إضافات للوسائط والبث</span></div>'+(examples.length?'<p class="muted" style="margin:10px 0 0">أمثلة من البلجنات المسجلة لهذا المنتج:</p><div class="plugin-examples">'+examples.map(x=>'<div class="plugin-example"><span class="plugin-emoji">🧩</span><div><b>'+esc(x.name)+'</b><small>'+esc(x.desc)+'</small></div></div>').join('')+'</div>':'<p class="sales-footnote">تختلف الإضافات المناسبة حسب صورة النظام وإصدارها؛ اسألنا عن البلجن المطلوب وتوافقه مع جهازك.</p>')+'</section>';

function whyBuy(p){
 const specs=p.specifications||{},features=values(p.features).map(String),all=[p.name,p.description,p.brand,p.category,...features,...Object.entries(specs).flatMap(([k,v])=>[k,String(v)])].join(' ').toLowerCase();
