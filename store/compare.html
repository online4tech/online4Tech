<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="قارن مواصفات أجهزة الاستقبال من Online4Tech."><title>مقارنة الأجهزة | Online4Tech</title><style>
body{margin:0;background:#07111f;color:#f3f7ff;font-family:Tahoma,Arial,sans-serif;line-height:1.8}.wrap{width:min(1100px,94%);margin:auto}.nav{padding:16px 0;border-bottom:1px solid #29425d}.nav a{color:#68d5ff;margin-inline:8px}.panel{margin:22px 0;padding:18px;background:#0d1b2d;border:1px solid #29425d;border-radius:16px}.selectors{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field{width:100%;background:#07111f;color:white;border:1px solid #29425d;padding:10px;border-radius:9px;font:inherit;min-width:0}.btn{background:#68d5ff;color:#07111f;border:0;border-radius:9px;padding:10px 15px;font-weight:bold;cursor:pointer}.muted{color:#a9bbd0}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:right;padding:11px;border-bottom:1px solid #29425d}th{color:#a9bbd0}td img{width:100%;height:110px;object-fit:contain;background:#fff;border-radius:8px}@media(max-width:600px){.selectors{grid-template-columns:1fr 1fr}}
</style></head><body><header class="nav"><div class="wrap"><a href="./index.html">Online4Tech Store</a><a href="../downloads.html">التحميلات</a></div></header><main class="wrap"><section class="panel"><h1>مقارنة الأجهزة</h1><p class="muted">اختار من جهازين إلى 4 أجهزة وقارن المواصفات الفنية وتواصل معنا لمعرفة سعر كل جهاز.</p><div id="selectors" class="selectors"></div><p><button class="btn" id="run">قارن الاختيارات</button></p><div id="result" class="tablewrap"></div></section></main><script>
let products=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>n?new Intl.NumberFormat('ar-EG',{style:'currency',currency:'EGP',maximumFractionDigits:0}).format(n):'عند التواصل';fetch('../data/products.json').then(r=>r.json()).then(d=>{products=d.products||[];let ids=(new URLSearchParams(location.search).get('ids')||'').split(',');document.getElementById('selectors').innerHTML=[0,1,2,3].map(i=>'<select class="field" aria-label="الجهاز '+(i+1)+'"><option value="">اختار جهازًا</option>'+products.filter(p=>p.category==='Receiver').map(p=>'<option value="'+esc(p.id)+'" '+(ids[i]===p.id?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>').join('');document.getElementById('run').click()});document.getElementById('run').onclick=()=>{let ids=[...document.querySelectorAll('#selectors select')].map(x=>x.value).filter(Boolean),ps=[...new Set(ids)].slice(0,4).map(id=>products.find(p=>p.id===id)).filter(Boolean);if(ps.length<2){document.getElementById('result').innerHTML='<p class="muted">اختار جهازين على الأقل للمقارنة.</p>';return}const row=(label,fn)=>'<tr><th>'+label+'</th>'+ps.map(p=>'<td>'+esc(fn(p)||'—')+'</td>').join('')+'</tr>';document.getElementById('result').innerHTML='<table><tbody><tr><th>الجهاز</th>'+ps.map(p=>'<td><img src="'+esc(p.images[0]||'')+'" alt=""><h3>'+esc(p.name)+'</h3><a href="./product.html?id='+encodeURIComponent(p.slug)+'">تفاصيل المنتج</a></td>').join('')+'</tr>'+row('البراند',p=>p.brand)+row('السعر',p=>'<a class="btn" target="_blank" rel="noopener" href="'+esc(p.whatsappLink||('https://wa.me/201092978131?text='+encodeURIComponent('السعر: '+p.name)))+'">السعر عند التواصل عبر واتساب</a>')+row('الحالة',p=>p.condition==='Used'?'مستعمل':'جديد')+row('CPU',p=>p.specifications.CPU)+row('RAM',p=>p.specifications.RAM)+row('التخزين',p=>p.specifications.Storage)+row('التونر',p=>p.specifications.Tuners)+row('دعم 4K',p=>p.specifications['4K'])+row('الشبكة',p=>p.specifications.Network)+row('منافذ USB',p=>p.specifications.USB)+row('المخزون',p=>p.stock>0?'متاح ('+p.stock+')':'نفد')+'</tbody></table>'};
</script></body></html>
