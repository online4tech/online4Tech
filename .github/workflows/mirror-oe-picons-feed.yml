name: Mirror OE-Alliance Picons feed under Online4Tech

on:
  push:
    paths:
      - ".github/workflows/mirror-oe-picons-feed.yml"
  schedule:
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      run_now:
        description: "تشغيل مزامنة Picons الآن بعد توفر GitHub API"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: online4tech-main-push
  cancel-in-progress: false

jobs:
  mirror-picons:
    if: github.event_name == 'schedule' || inputs.run_now == true
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Online4Tech
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/scripts/mirror_oe_picons_feed.py
            .github/scripts/mirror_khaledali65_ipks.py
            .github/scripts/merge_catalog_changes.py
            assets/allblugin/demo-data.json
            monitoring
          sparse-checkout-cone-mode: false
      - name: Switch to main branch for commits
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mirror and verify Picons packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/mirror_oe_picons_feed.py
      - name: Merge and publish Online4Tech feed links
        shell: bash
        run: |
          set -euo pipefail
          cp assets/allblugin/demo-data.json /tmp/online4tech-local-catalog.json
          cp monitoring/online4tech-picons-feed-manifest.json /tmp/online4tech-picons-feed-manifest.json
          cp monitoring/ONLINE4TECH-PICONS-FEED.md /tmp/online4tech-picons-feed-report.md
          python3 .github/scripts/merge_catalog_changes.py /tmp/online4tech-local-catalog.json assets/allblugin/demo-data.json
          cp /tmp/online4tech-picons-feed-manifest.json monitoring/online4tech-picons-feed-manifest.json
          cp /tmp/online4tech-picons-feed-report.md monitoring/ONLINE4TECH-PICONS-FEED.md
          git add -f assets/allblugin/demo-data.json monitoring/online4tech-picons-feed-manifest.json monitoring/ONLINE4TECH-PICONS-FEED.md
          if git diff --cached --quiet; then
            echo "No Picons feed catalog changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Mirror OE-Alliance Picons feed under Online4Tech"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed; retrying in 10s..."
              sleep 10
            done
            if [ "$pushed" = false ]; then
              echo "Failed to push after 5 attempts."
              exit 1
            fi
          fi
      - name: Upload Picons feed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online4tech-picons-feed-report
          path: monitoring/ONLINE4TECH-PICONS-FEED.md
          if-no-files-found: ignore
          retention-days: 30
