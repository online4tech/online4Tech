name: Refresh plugin sitemap
on:
  push:
    branches: [main]
    paths:
      - 'data/plugins.json'
      - 'scripts/build_plugin_sitemap.py'
      - '.github/workflows/plugin-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-plugin-sitemap
  cancel-in-progress: false
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Add all JSON plugins to sitemap
        run: python scripts/build_plugin_sitemap.py
      - name: Commit sitemap if changed
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore(seo): refresh plugin detail sitemap"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              sleep 10
            done
          fi
