name: Refresh plugin sitemap
on:
  push:
    branches: [main]
    paths:
      - 'data/plugins.json'
      - 'scripts/build_plugin_sitemap.py'
      - '.github/workflows/plugin-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add all JSON plugins to sitemap
        run: python scripts/build_plugin_sitemap.py
      - name: Commit sitemap if changed
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore(seo): refresh plugin detail sitemap"
            git push
          fi
