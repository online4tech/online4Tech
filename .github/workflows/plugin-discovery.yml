name: Daily Enigma2 plugin discovery

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-plugin-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare rollback backup
        run: cp data/plugins.json plugins.backup.json
      - name: Discover, validate and update plugin catalog
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          trap 'cp plugins.backup.json data/plugins.json; git checkout -- data/plugins.json data/search-index.json sitemap.xml data/discovery-report.json 2>/dev/null || true' ERR
          python -m py_compile scripts/discover_plugins.py scripts/build_search_index.py scripts/build_plugin_sitemap.py
          python scripts/discover_plugins.py
          python -m json.tool data/plugins.json > /dev/null
          python -m json.tool data/search-index.json > /dev/null
          python -m json.tool data/discovery-report.json > /dev/null
      - name: Upload rollback backup and discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-discovery-\${{ github.run_number }}
          path: |
            plugins.backup.json
            data/discovery-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit catalog, search index, sitemap and report when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plugins.json data/search-index.json sitemap.xml data/discovery-report.json
          if git diff --cached --quiet; then
            echo "No changes detected; no commit created."
            exit 0
          fi
          git commit -m "chore(plugins): daily plugin catalog update"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "Push failed after retries; no changes were pushed."
          exit 1
