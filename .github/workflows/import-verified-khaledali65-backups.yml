name: Import verified KhaledAli65 backups

on:
  push:
    paths:
      - ".github/workflows/import-verified-khaledali65-backups.yml"
      - ".github/scripts/import_verified_khaledali65_backups.py"
  workflow_run:
    workflows: ["Monitor KhaledAli65 Enigma2 releases"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-verified-backups
  cancel-in-progress: false

jobs:
  import-verified-backups:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Switch to main branch for commits
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download, validate, and mirror backup archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/import_verified_khaledali65_backups.py

      - name: Commit verified catalog entries
        shell: bash
        run: |
          set -euo pipefail
          cp assets/allblugin/demo-data.json /tmp/online4tech-local-catalog.json
          cp monitoring/KHALEDALI65-VERIFIED-IMPORT.md /tmp/online4tech-backup-report.md
          python3 .github/scripts/merge_catalog_changes.py /tmp/online4tech-local-catalog.json assets/allblugin/demo-data.json
          cp /tmp/online4tech-backup-report.md monitoring/KHALEDALI65-VERIFIED-IMPORT.md
          git add -f assets/allblugin/demo-data.json monitoring/KHALEDALI65-VERIFIED-IMPORT.md
          if git diff --cached --quiet; then
            echo "No verified backup catalog changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import verified KhaledAli65 receiver backups"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed; retrying in 10s..."
              sleep 10
            done
            if [ "$pushed" = false ]; then
              echo "Failed to push after 5 attempts."
              exit 1
            fi
          fi

      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khaledali65-verified-import-report
          path: monitoring/KHALEDALI65-VERIFIED-IMPORT.md
          if-no-files-found: ignore
          retention-days: 30
