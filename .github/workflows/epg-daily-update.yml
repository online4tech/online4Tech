name: Update Online4Tech EPG daily

# Generates fresh EPG guides every day from public sources and
# publishes them in this repo, so the plugin always downloads from
# Online4Tech's own links that never die.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Clone the iptv-org EPG grabber
        run: git clone --depth 1 https://github.com/iptv-org/epg.git /tmp/epg-tool

      - name: Install grabber dependencies
        working-directory: /tmp/epg-tool
        run: npm ci

      - name: Grab fresh guides (beIN, OSN, beIN Sports)
        working-directory: /tmp/epg-tool
        run: |
          npm run grab --- \
            --sites=bein.com,osn.com,beinsports.com \
            --output=/tmp/guides/{site}.xml \
            --maxConnections=10

      - name: Grab fresh guide (elCinema, slow)
        working-directory: /tmp/epg-tool
        run: |
          npm run grab --- \
            --sites=elcinema.com \
            --output=/tmp/guides/{site}.xml \
            --maxConnections=3

      - name: Remap channel ids to Online4Tech ids
        run: |
          python3 epg/scripts/remap-epg-ids.py \
            --mapping epg/scripts/id-mapping.json \
            --input-dir /tmp/guides \
            --output-dir epg/guides

      - name: Commit updated guides
        run: |
          git config user.name "Online4Tech EPG"
          git config user.email "epg@online4tech"
          git add epg/guides
          git diff --cached --quiet || git commit -m "EPG daily update $(date -u +%Y-%m-%d)"
          git push
