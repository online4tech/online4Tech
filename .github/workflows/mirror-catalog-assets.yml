name: Mirror all catalog downloads to Online4Tech

on:
  workflow_run:
    workflows: ["Mirror KhaledAli65 Telnet scripts for review", "Mirror verified KhaledAli65 IPK packages"]
    types: [completed]
  schedule:
    - cron: "13 3 * * *"
  workflow_dispatch:
    inputs:
      retry_mediafire:
        description: "إعادة محاولة نقل ملفات MediaFire المؤجلة"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: online4tech-catalog-assets
  cancel-in-progress: false

jobs:
  mirror-catalog:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      O4T_RETRY_MEDIAFIRE: ${{ (github.event_name == 'schedule' || inputs.retry_mediafire) && '1' || '0' }}
    timeout-minutes: 180
    steps:
      - name: Checkout Online4Tech
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/scripts/mirror_catalog_assets.py
            .github/scripts/mirror_khaledali65_ipks.py
            .github/scripts/merge_catalog_changes.py
            assets/allblugin/demo-data.json
            monitoring
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mirror direct catalog assets and validate files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/mirror_catalog_assets.py
      - name: Merge and publish Online4Tech catalog links
        shell: bash
        run: |
          set -euo pipefail
          cp assets/allblugin/demo-data.json /tmp/online4tech-local-catalog.json
          cp monitoring/catalog-assets-mirror-manifest.json /tmp/online4tech-catalog-assets-manifest.json
          cp monitoring/CATALOG-ASSETS-MIRROR.md /tmp/online4tech-catalog-assets-report.md
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          python3 .github/scripts/merge_catalog_changes.py /tmp/online4tech-local-catalog.json assets/allblugin/demo-data.json
          cp /tmp/online4tech-catalog-assets-manifest.json monitoring/catalog-assets-mirror-manifest.json
          cp /tmp/online4tech-catalog-assets-report.md monitoring/CATALOG-ASSETS-MIRROR.md
          git add -f assets/allblugin/demo-data.json monitoring/catalog-assets-mirror-manifest.json monitoring/CATALOG-ASSETS-MIRROR.md
          if git diff --cached --quiet; then
            echo "No catalog changes to publish."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Mirror catalog downloads under Online4Tech links"
            git push
          fi
      - name: Upload catalog mirror report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online4tech-catalog-assets-report
          path: monitoring/CATALOG-ASSETS-MIRROR.md
          if-no-files-found: ignore
          retention-days: 30
