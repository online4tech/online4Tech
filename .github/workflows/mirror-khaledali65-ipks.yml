name: Mirror verified KhaledAli65 IPK packages

on:
  workflow_run:
    workflows: ["Monitor KhaledAli65 Enigma2 releases"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_now:
        description: "تشغيل مزامنة حزم IPK الآن"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mirror-ipks
  cancel-in-progress: false

jobs:
  mirror-ipks:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || inputs.run_now == true
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Online4Tech repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/scripts/mirror_khaledali65_ipks.py
            .github/scripts/merge_catalog_changes.py
            assets/allblugin/demo-data.json
            monitoring
          sparse-checkout-cone-mode: false

      - name: Switch to main branch for commits
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror and validate IPK packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/mirror_khaledali65_ipks.py

      - name: Commit mirrored package catalog
        shell: bash
        run: |
          set -euo pipefail
          cp assets/allblugin/demo-data.json /tmp/online4tech-local-catalog.json
          cp monitoring/KHALEDALI65-IPK-MIRROR.md /tmp/online4tech-ipk-report.md
          python3 .github/scripts/merge_catalog_changes.py /tmp/online4tech-local-catalog.json assets/allblugin/demo-data.json
          cp /tmp/online4tech-ipk-report.md monitoring/KHALEDALI65-IPK-MIRROR.md
          git add -f assets/allblugin/demo-data.json monitoring/KHALEDALI65-IPK-MIRROR.md
          if git diff --cached --quiet; then
            echo "No new IPK packages to publish."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Mirror verified Enigma2 IPK packages"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed; retrying in 10s..."
              sleep 10
            done
            if [ "$pushed" = false ]; then
              echo "Failed to push after 5 attempts."
              exit 1
            fi
          fi

      - name: Upload IPK mirror report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online4tech-ipk-mirror-report
          path: monitoring/KHALEDALI65-IPK-MIRROR.md
          if-no-files-found: ignore
          retention-days: 30
