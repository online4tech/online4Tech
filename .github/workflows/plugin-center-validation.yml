name: Validate plugin center
on:
  push:
    branches: [main, feature/plugin-center-json-driven]
    paths:
      - 'data/plugins.json'
      - 'js/plugins.js'
      - 'js/plugin-detail.js'
      - 'js/plugins-search.js'
      - 'js/plugins-filters.js'
      - 'css/plugins.css'
      - 'plugins/index.html'
      - 'plugins/plugin.html'
      - 'images/plugins/placeholder.svg'
      - 'scripts/discover_plugin_images.py'
      - 'scripts/download-plugin-images.js'
      - 'data/image-cache.json'
      - 'data/image-report.json'
      - 'backup/plugins.backup.json'
      - '.github/workflows/plugin-images.yml'
      - 'scripts/build_plugin_sitemap.py'
      - 'scripts/discover_plugins.py'
      - 'scripts/build_search_index.py'
      - 'scripts/check_plugin_releases.py'
      - '.github/workflows/plugin-release-check.yml'
      - '.github/workflows/plugin-discovery.yml'
      - '.github/workflows/plugin-image-assets.yml'
      - '.github/workflows/plugin-center-validation.yml'
  pull_request:
    paths:
      - 'data/plugins.json'
      - 'js/plugins.js'
      - 'js/plugin-detail.js'
      - 'js/plugins-search.js'
      - 'js/plugins-filters.js'
      - 'scripts/build_plugin_sitemap.py'
      - 'scripts/discover_plugins.py'
      - 'scripts/build_search_index.py'
      - 'scripts/check_plugin_releases.py'
      - '.github/workflows/plugin-release-check.yml'
      - '.github/workflows/plugin-discovery.yml'
      - '.github/workflows/plugin-image-assets.yml'
      - 'scripts/download-plugin-images.js'
      - '.github/workflows/plugin-images.yml'
      - 'css/plugins.css'
      - 'plugins/index.html'
      - 'plugins/plugin.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate JSON catalog and GitHub-only policy
        run: |
          python - <<'PY'
          import json, re
          from urllib.parse import urlparse
          d = json.load(open('data/plugins.json', encoding='utf-8'))
          assert isinstance(d.get('plugins'), list), 'plugins must be a list'
          plugins = d['plugins']
          ids = [p.get('id') for p in plugins]
          assert all(ids) and len(ids) == len(set(ids)), 'plugin IDs must be unique and non-empty'
          required = ('id','name','slug','description','arabicDescription','version','author','category','featured','latest','rating','downloadsCount','icon','logoFound','screenshots','supportedDevices','supportedImages','installationMethod','requirements','youtubeVideo','githubUrl','officialWebsite','downloads','tags','changelog','relatedPlugins')
          for p in plugins:
              missing = [key for key in required if key not in p]
              assert not missing, f"{p.get('id')}: missing schema fields {missing}"
              assert isinstance(p['logoFound'], bool), f"{p['id']}: logoFound must be boolean"
              assert isinstance(p['screenshots'], list), f"{p['id']}: screenshots must be a list"
              assert p['logoFound'] or not p.get('icon') and not p.get('thumbnail'), f"{p['id']}: unverified logo reference"
              for shot in p['screenshots']:
                  assert isinstance(shot, str) and re.fullmatch(r'images/plugins/[^/]+/screenshot-\d+\.webp', shot), f"{p['id']}: screenshot must be a local WebP asset"
              for value in (p.get('githubUrl'), p.get('downloadUrl'), p.get('officialWebsite'), (p.get('downloads') or {}).get('repository'), (p.get('downloads') or {}).get('githubRelease')):
                  if value:
                      parsed = urlparse(value)
                      assert parsed.scheme == 'https' and parsed.hostname in ('github.com','www.github.com','raw.githubusercontent.com'), f"{p['id']}: non-GitHub URL blocked: {value}"
              release = (p.get('downloads') or {}).get('githubRelease', '')
              assert not release or '/releases' in urlparse(release).path, f"{p['id']}: release link is not a GitHub Releases URL"
          print(f"Validated {len(plugins)} plugins, required schema, logo policy, local galleries and GitHub-only URLs")
          PY
      - name: Check JavaScript syntax
        run: |
          node --check scripts/download-plugin-images.js
          node --check js/plugins.js
          node --check js/plugin-detail.js
          node --check js/plugins-search.js
          node --check js/plugins-filters.js
      - name: Check Python generators
        run: python -m py_compile scripts/build_plugin_sitemap.py scripts/build_search_index.py scripts/discover_plugins.py scripts/discover_plugin_images.py scripts/check_plugin_releases.py
