name: Manually refresh plugin image assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-image-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install image optimizer
        run: npm install --no-save --no-package-lock sharp
      - name: Download only approved GitHub logos and screenshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          node --check scripts/download-plugin-images.js
          node scripts/download-plugin-images.js
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const data = JSON.parse(fs.readFileSync('data/plugins.json', 'utf8'));
          if (!Array.isArray(data.plugins)) throw new Error('Invalid plugin catalog');
          for (const p of data.plugins) {
            if (typeof p.logoFound !== 'boolean' || !Array.isArray(p.screenshots)) throw new Error('Invalid logo/gallery fields: ' + p.id);
            if (p.logoFound && (!/^images\/plugins\/[^/]+\/icon\.webp$/i.test(p.icon) || !/^images\/plugins\/[^/]+\/thumbnail\.webp$/i.test(p.thumbnail))) throw new Error('Invalid verified logo paths: ' + p.id);
            if (!p.logoFound && (p.icon || p.thumbnail)) throw new Error('Unverified logo reference: ' + p.id);
            for (const shot of p.screenshots) if (!/^images\/plugins\/[^/]+\/screenshot-\d+\.webp$/i.test(shot)) throw new Error('Invalid screenshot path: ' + p.id + ' => ' + shot);
          }
          console.log('Validated logos and local screenshots for ' + data.plugins.length + ' plugins');
          NODE
      - name: Commit generated catalog and assets only when changed
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plugins.json data/image-cache.json data/image-report.json backup/plugins.backup.json images/plugins/
          if git diff --cached --quiet; then
            echo "No image or catalog changes; no commit created."
            exit 0
          fi
          git commit -m "chore(plugins): refresh verified GitHub image assets"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "Push failed after retries."
          exit 1
