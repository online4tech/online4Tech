name: Build search index

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'js/**'
      - 'css/**'
      - 'assets/site-header.js'
      - 'robots.txt'
      - 'data/plugins.json'
      - 'sitemap.xml'
      - 'scripts/build_search_index.py'
      - '.github/workflows/search-index.yml'
  workflow_dispatch:

concurrency:
  group: refresh-search-index
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Check JavaScript syntax
        run: |
          node --check js/search.js
          node --check assets/site-header.js
      - name: Validate search index JSON
        run: python -m json.tool data/search-index.json > /dev/null
      - name: Generate search index
        run: python scripts/build_search_index.py
      - name: Commit generated index when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/search-index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild search index"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              sleep 10
            done
          fi
