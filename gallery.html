<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f">
<title>معرض الصور | Online4Tech</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#102239;--line:#29435f;--text:#f4f8ff;--muted:#a7bad1;--blue:#67d2ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#173957 0,transparent 42%),var(--bg);color:var(--text);font:16px/1.8 Tahoma,Arial,sans-serif}.wrap{width:min(1160px,92%);margin:auto}header{border-bottom:1px solid var(--line);background:#07111fee}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;flex-wrap:wrap}.brand{font-weight:bold;font-size:1.15rem;text-decoration:none;color:var(--text)}.brand span{color:var(--blue)}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #34516d;border-radius:11px;padding:8px 13px;color:var(--text);background:#102139;font-size:.88rem;cursor:pointer}.hero{padding:36px 0 18px}.tag{display:inline-block;color:var(--blue);border:1px solid #315574;background:#10253b;border-radius:999px;padding:4px 12px;font-size:.8rem}.hero h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.3;margin:12px 0 6px}.hero p{color:var(--muted);margin:0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}.search{flex:1;min-width:200px;background:#091727;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit}.count{color:var(--muted);font-size:.86rem}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:10px 0 42px}.tile{overflow:hidden;background:linear-gradient(155deg,#13283e,#0b1726);border:1px solid var(--line);border-radius:17px;box-shadow:0 14px 32px #0003;transition:transform .2s,border-color .2s}.tile:hover{transform:translateY(-4px);border-color:var(--blue)}.tile button{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}.tile img{display:block;width:100%;height:240px;object-fit:cover;background:#091421}.filename{padding:11px 13px;color:#dce9f8;font-size:.86rem;overflow-wrap:anywhere}.state{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px;margin:8px 0 35px}.state a{color:var(--blue)}.lightbox{display:none;position:fixed;inset:0;z-index:50;background:#02060dee;align-items:center;justify-content:center;padding:24px}.lightbox.open{display:flex}.lightbox img{max-width:95vw;max-height:86vh;object-fit:contain;border-radius:12px}.close{position:absolute;top:18px;left:18px;font-size:1.2rem}.foot{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:.8rem}@media(max-width:800px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.tile img{height:210px}}@media(max-width:520px){.gallery{grid-template-columns:1fr}.tile img{height:auto;max-height:360px}.hero{padding-top:26px}}
</style></head><body>
<header><div class="wrap top"><a class="brand" href="index.html">Online<span>4Tech</span></a><a class="btn" id="backLink" href="downloads.html">← رجوع</a></div></header>
<main class="wrap"><section class="hero"><span class="tag">PHOTO GALLERY · ONLINE4TECH</span><h1 id="title">معرض الصور</h1><p id="subtitle">صور المنتج أو البلجن أو الباك أب في مكان واحد، بتصميم مناسب للموبايل والكمبيوتر.</p></section>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="ابحث باسم الصورة..." aria-label="ابحث باسم الصورة"><span class="count" id="count">جاري تحميل الصور…</span></div>
<div id="gallery" class="gallery"></div><div id="state" class="state">جاري قراءة مجلد الصور من GitHub…</div></main>
<footer><div class="wrap foot">© 2026 Online4Tech · معرض صور يتم تحديثه تلقائيًا من ملفات المستودع</div></footer>
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="عرض الصورة المكبرة"><button class="btn close" id="close" type="button">✕ إغلاق</button><img id="large" alt=""></div>
<script>
const params=new URLSearchParams(location.search),folder=(params.get('folder')||'images').replace(/^\/+|\/+$/g,''),label=params.get('name')||folder.split('/').pop().replace(/[-_]+/g,' ');
const title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),gallery=document.getElementById('gallery'),state=document.getElementById('state'),count=document.getElementById('count'),search=document.getElementById('search');
title.textContent='صور '+label;document.title='صور '+label+' | Online4Tech';
document.getElementById('backLink').href=folder.startsWith('images/plugins/')?'plugins/':folder.startsWith('images/skins/')?'skins.html':folder.startsWith('images/backups/')?'devices/model.html?device='+encodeURIComponent(folder.split('/')[2]||''):'downloads.html';
const allowed=/\.(png|jpe?g|gif|webp|avif|svg)$/i;let images=[];
function render(){const q=search.value.trim().toLowerCase();const shown=images.filter(x=>x.name.toLowerCase().includes(q));gallery.innerHTML=shown.map((x,i)=>'<article class="tile"><button type="button" data-index="'+images.indexOf(x)+'" aria-label="تكبير '+escapeHtml(x.name)+'"><img src="'+x.url+'" alt="'+escapeHtml(x.name)+'" loading="lazy"></button><div class="filename">'+escapeHtml(x.name)+'</div></article>').join('');count.textContent=shown.length+' صورة';gallery.querySelectorAll('button[data-index]').forEach(b=>b.addEventListener('click',()=>openImage(images[Number(b.dataset.index)])));if(!shown.length){state.style.display='block';state.textContent=images.length?'مفيش صور مطابقة للبحث.':'مفيش صور مرفوعة في المجلد لسه.'}else state.style.display='none'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openImage(x){document.getElementById('large').src=x.url;document.getElementById('large').alt=x.name;document.getElementById('lightbox').classList.add('open')}
function closeImage(){document.getElementById('lightbox').classList.remove('open');document.getElementById('large').src=''}
document.getElementById('close').addEventListener('click',closeImage);document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeImage()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeImage()});search.addEventListener('input',render);
async function loadImages(path){const r=await fetch('https://api.github.com/repos/online4tech/online4Tech/git/trees/main?recursive=1',{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(r.status===403?'GitHub حدّ عدد طلبات قراءة الصور مؤقتًا. جرّب بعد دقيقة.':'تعذر قراءة قائمة الصور من GitHub.');const tree=await r.json();if(!Array.isArray(tree.tree))throw new Error('GitHub لم يرجّع قائمة الملفات بشكل صحيح.');const prefix=path.replace(/\/$/,'')+'/';return tree.tree.filter(entry=>entry.type==='blob'&&entry.path.startsWith(prefix)&&allowed.test(entry.path)&&!entry.path.slice(prefix.length).split('/').slice(0,-1).includes('')).map(entry=>({name:entry.path.slice(prefix.length),url:'https://raw.githubusercontent.com/online4tech/online4Tech/main/'+entry.path,path:entry.path}));}
loadImages(folder).then(found=>{images=found.sort((a,b)=>a.path.localeCompare(b.path));render()}).catch(e=>{count.textContent='';state.textContent=e.message+' ارفع الصور داخل المجلد المحدد أو أي مجلد فرعي، وهتظهر هنا تلقائيًا.'});
</script></body></html>
