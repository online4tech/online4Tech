<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
<title id="title">OnLine4Tech — خليك دايما اونلاين</title>
<desc id="desc">شعار تقني بخلفية كحلي داكنة، حرف O أبيض بداخله دائرة حمراء، مثلث أحمر فوق i، رقم 4 أزرق، وطبق استقبال فضائي.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07182f"/><stop offset=".55" stop-color="#020b1a"/><stop offset="1" stop-color="#09254b"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d5deeb"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08d1f4"/><stop offset="1" stop-color="#0872ff"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff424b"/><stop offset="1" stop-color="#d90020"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="900" height="220" rx="12" fill="url(#bg)"/>
<ellipse cx="450" cy="102" rx="350" ry="65" fill="#0b55a0" opacity=".12" filter="url(#glow)"/>
<!-- Satellite dish and signal -->
