<text x="34" y="126" font-family="Arial,Helvetica,sans-serif" font-size="106" font-style="italic" font-weight="900" fill="url(#silver)">O</text>
<circle cx="81" cy="91" r="20" fill="url(#red)"/>
<text x="101" y="126" font-family="Arial,Helvetica,sans-serif" font-size="92" font-style="italic" font-weight="900" letter-spacing="-5" fill="url(#silver)">nLine</text>
