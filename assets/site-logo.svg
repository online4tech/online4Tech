<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
<title id="title">OnLine4Tech — خليك دايما اونلاين</title>
<desc id="desc">شعار Online4Tech بخلفية شفافة، حروف بيضاء بتحديد كحلي، دائرة حمراء داخل O، مثلث أحمر فوق i، رقم 4 أزرق، وطبق استقبال فضائي، وتحته السلوغان.</desc>
<defs>
